<mat-card class="p-4 shadow-sm">
  <h3 class="fw-bold mb-4">Profile Details</h3>

  <!-- Loading spinner -->
  <div *ngIf="isLoading" class="text-center py-5">
    <mat-icon class="spin-icon">autorenew</mat-icon>
    <p class="text-muted mt-2">Loading profile...</p>
  </div>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading">

    <!-- Personal Info Section -->
    <h5 class="text-primary mb-3">Personal Information</h5>

    <div class="row">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName">
        </mat-form-field>
      </div>

      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName">
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email Address</mat-label>
          <input matInput formControlName="email">
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>
      </div>

      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Contact Number</mat-label>
          <input matInput formControlName="contactNumber">
        </mat-form-field>
      </div>
    </div>

    <mat-divider class="my-4"></mat-divider>

    <!-- Address Section -->
    <h5 class="text-primary mb-3">Billing Address</h5>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Street Address</mat-label>
      <input matInput formControlName="addressLine1">
    </mat-form-field>

    <div class="row">
      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>City</mat-label>
          <input matInput formControlName="city">
        </mat-form-field>
      </div>

      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Postal Code</mat-label>
          <input matInput formControlName="postalCode">
        </mat-form-field>
      </div>

      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Country</mat-label>
          <input matInput formControlName="country">
        </mat-form-field>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button mat-raised-button color="primary" type="submit">
        Save Changes
      </button>
    </div>

  </form>


  <div class="mt-5 pt-4 border-top">
    <div class="d-flex justify-content-between align-items-center p-3 bg-light rounded border">
      <div>
        <h5 class="fw-bold m-0 text-dark">Teach on E-Learning</h5>
        <p class="text-muted small m-0">Become an instructor and publish your own courses.</p>
      </div>
      <button type="button" mat-flat-button color="accent" (click)="requestInstructor()">
        Apply Now
      </button>
    </div>
  </div>

</mat-card>
