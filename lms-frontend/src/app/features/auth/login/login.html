<div class="login-wrapper d-flex justify-content-center align-items-center vh-100">
  <div class="login-card shadow-lg p-4 p-md-5 border-0">

    <div class="text-center mb-4">
      <div class="logo-circle mb-3">
        <i class="bi bi-person-lock fs-1 text-primary"></i>
      </div>
      <h2 class="fw-bold text-dark">Welcome Back</h2>
      <p class="text-muted">Please enter your details to login</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-soft-danger d-flex align-items-center mb-4" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <div>{{ errorMessage }}</div>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-floating mb-3">
        <input type="email" name="email" [(ngModel)]="loginData.email"
               class="form-control custom-input" id="emailInput"
               placeholder="name@example.com" required>
        <label for="emailInput">Email Address</label>
      </div>

      <div class="form-floating mb-4">
        <input type="password" name="password" [(ngModel)]="loginData.password"
               class="form-control custom-input" id="passwordInput"
               placeholder="Password" required>
        <label for="passwordInput">Password</label>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-3 fw-bold login-btn"
              [disabled]="!loginForm.form.valid">
        SIGN IN
      </button>
    </form>

    <div class="text-center mt-4 pt-2">
      <p class="text-muted small">
        Don't have an account yet?
        <a routerLink="/register" class="text-primary fw-bold text-decoration-none ms-1">Create Account</a>
      </p>
    </div>
  </div>
</div>
