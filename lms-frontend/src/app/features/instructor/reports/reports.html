<div class="container-fluid p-4">
  
  <!-- Header -->
  <div class="d-flex align-items-center mb-4">
    <button mat-icon-button routerLink="/instructor/dashboard" class="me-2">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div>
      <h1 class="fw-bold m-0">Analytics & Reports</h1>
      <p class="text-muted m-0">Track your course performance and earnings</p>
    </div>
    <div class="ms-auto">
      <button mat-stroked-button color="primary">
        <mat-icon>download</mat-icon> Export CSV
      </button>
    </div>
  </div>

  <!-- 1. Overview Cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-3" *ngFor="let stat of stats">
      <mat-card class="shadow-sm border-0 h-100">
        <mat-card-content class="d-flex align-items-center p-3">
          <div class="rounded-circle bg-light p-3 me-3">
            <mat-icon class="fs-2 {{stat.color}}">{{stat.icon}}</mat-icon>
          </div>
          <div>
            <p class="text-muted small mb-0">{{stat.label}}</p>
            <h2 class="fw-bold m-0">{{stat.value}}</h2>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>

  <div class="row">
    
    <!-- 2. Sales Trend (Visual Chart) -->
    <div class="col-md-4 mb-4">
      <mat-card class="shadow-sm border-0 h-100">
        <mat-card-header class="p-3 border-bottom">
          <mat-card-title>Monthly Trends</mat-card-title>
        </mat-card-header>
        <mat-card-content class="p-4">
          <div class="d-flex justify-content-between align-items-end" style="height: 200px;">
            <div *ngFor="let item of monthlySales" class="d-flex flex-column align-items-center" style="width: 15%;">
              <div class="bg-primary rounded-top w-100" 
                   [style.height.%]="item.value" 
                   matTooltip="{{item.value}} Sales"></div>
              <small class="text-muted mt-2">{{item.month}}</small>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    <!-- 3. Course Performance Table -->
    <div class="col-md-8 mb-4">
      <mat-card class="shadow-sm border-0 h-100">
        <mat-card-header class="p-3 border-bottom">
          <mat-card-title>Course Performance</mat-card-title>
        </mat-card-header>
        <mat-card-content class="p-0">
          <table mat-table [dataSource]="coursePerformance" class="w-100">
            
            <ng-container matColumnDef="title">
              <th mat-header-cell *matHeaderCellDef> Course </th>
              <td mat-cell *matCellDef="let element" class="fw-bold text-primary"> {{element.title}} </td>
            </ng-container>
          
            <ng-container matColumnDef="students">
              <th mat-header-cell *matHeaderCellDef> Students </th>
              <td mat-cell *matCellDef="let element"> {{element.students}} </td>
            </ng-container>
          
            <ng-container matColumnDef="revenue">
              <th mat-header-cell *matHeaderCellDef> Revenue </th>
              <td mat-cell *matCellDef="let element"> ${{element.revenue}} </td>
            </ng-container>

            <ng-container matColumnDef="rating">
              <th mat-header-cell *matHeaderCellDef> Rating </th>
              <td mat-cell *matCellDef="let element"> 
                <div class="d-flex align-items-center">
                  <mat-icon class="icon-sm text-warning me-1">star</mat-icon> {{element.rating}} 
                </div>
              </td>
            </ng-container>
          
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </mat-card-content>
      </mat-card>
    </div>

  </div>
</div>
