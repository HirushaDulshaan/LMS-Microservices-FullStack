<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      
      <mat-card class="shadow p-4">
        <div class="d-flex align-items-center mb-4">
          <button mat-icon-button routerLink="/instructor/dashboard" class="me-2">
            <mat-icon>arrow_back</mat-icon>
          </button>
          <h2 class="fw-bold m-0">Edit Course</h2>
        </div>

        <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
          
          <!-- Title -->
          <mat-form-field appearance="outline" class="w-100 mb-3">
            <mat-label>Course Title</mat-label>
            <input matInput formControlName="title">
            <mat-error *ngIf="editForm.get('title')?.hasError('required')">Title is required</mat-error>
          </mat-form-field>

          <!-- Category & Level -->
          <div class="row">
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Category</mat-label>
                <mat-select formControlName="category">
                 <mat-option *ngFor="let category of categories" [value]="category.value">{{category.label}}</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Level</mat-label>
                <mat-select formControlName="level">
                  <mat-option *ngFor="let level of levels" [value]="level">{{level}}</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>

          <!-- Description -->
          <mat-form-field appearance="outline" class="w-100 mb-3">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" rows="4"></textarea>
          </mat-form-field>

          <!-- Price & Thumbnail Row -->
          <div class="row">
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Price ($)</mat-label>
                <input matInput type="number" formControlName="price" min="0">
                <mat-icon matPrefix>attach_money</mat-icon>
              </mat-form-field>
            </div>

            <!-- 👇 REVERTED: Simple Text Input for URL -->
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Thumbnail URL</mat-label>
                <input matInput formControlName="thumbnailUrl" placeholder="Paste Google Drive/Image Link">
                <mat-icon matSuffix>link</mat-icon>
                <mat-error *ngIf="editForm.get('thumbnailUrl')?.hasError('required')">
                  URL is required
                </mat-error>
              </mat-form-field>
            </div>
          </div>

          <!-- Update Button -->
          <div class="d-flex justify-content-end mt-3">
            <button type="button" mat-stroked-button color="warn" class="me-2" routerLink="/instructor/dashboard">Cancel</button>
            <button type="submit" mat-raised-button color="primary" class="px-4" [disabled]="editForm.invalid">Update Course</button>
          </div>

        </form>
      </mat-card>

    </div>
  </div>
</div>
